name: Lint, Test, and Setup Services

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "prisma/**"
      - "test/**"
      - "infra/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "vitest*.mts"
      - "biome.json"
      - ".github/workflows/lint-and-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "prisma/**"
      - "test/**"
      - "infra/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "vitest*.mts"
      - "biome.json"
      - ".github/workflows/lint-and-test.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: npm ci

    - name: Install Redis CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y redis-tools

    - name: Wait for services to be ready
      run: |
        until pg_isready -h localhost -p 5432; do
          echo "Waiting for Postgres...";
          sleep 2;
        done
        until redis-cli ping; do
          echo "Waiting for Redis...";
          sleep 2;
        done

    - name: Run lint
      run: npm run lint

    - name: Run tests with coverage
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/testdb
        REDIS_URL: redis://localhost:6379
        SESSION_SECRET: replaceme-with-a-long-random-secret
        DISK_THRESHOLD_PERCENT: 0.9
      run: |
        npm run db:generate
        npm run db:migrate
        npm run db:seed
        npm run test:cov
